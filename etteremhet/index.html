<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Éttermek Hete, kereshető lista</title>
<style>
:root{
  --bg:#faf7f2; --card:#fff; --line:#e6ded2; --ink:#241f1a; --ink2:#5a5047; --muted:#8a7f73;
  --accent:#8c2f27; --accent-soft:#f3e3e1; --good:#2f6b4f; --good-soft:#e3f0e8;
  --star:#c8901a; --radius:14px;
  --sans:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overflow-x:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
header{background:var(--ink);color:#f6f1ea;padding:22px 0 18px}
header h1{margin:0;font-size:clamp(20px,3.4vw,28px);font-weight:700;letter-spacing:-.01em}
header p{margin:6px 0 0;font-size:14px;color:#c9bdb0}
.bar{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 0 10px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);
  border-radius:999px;padding:9px 14px}
.search input{border:0;outline:0;font:inherit;flex:1;background:transparent;color:var(--ink);min-width:0}
.search .ico{color:var(--muted);flex:none}
.search button{border:0;background:transparent;color:var(--muted);font:inherit;cursor:pointer;padding:2px 4px}
.rowscroll{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.rowscroll::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;
  padding:7px 13px;font:600 13px var(--sans);color:var(--ink2);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.chip .n{opacity:.65;font-weight:700;margin-left:5px;font-variant-numeric:tabular-nums}
.chip.zero{opacity:.4}
.meta{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;
  padding:12px 0 4px;font-size:14px;color:var(--ink2)}
.meta b{color:var(--ink);font-variant-numeric:tabular-nums}
.meta select{font:inherit;padding:6px 10px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:14px;padding:8px 0 40px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;
  display:flex;flex-direction:column;
  /* Grid-blowout vedelem: rács-elem alapbol min-width:auto, tehat a kartya
     min-content szelessege (a lablec ar + ertekeles + ket gomb) kitolja a savot
     a kepernyorol. Enelkul mobilon a Foglalas gomb levagodik. */
  min-width:0}
.card .body{display:none}
.card .top{display:flex;gap:12px;padding:13px;min-width:0}
.card .top > div{min-width:0}
.card img{width:92px;height:92px;object-fit:cover;border-radius:10px;flex:none;background:var(--accent-soft)}
.card h2{margin:0 0 3px;font-size:16.5px;line-height:1.25;overflow-wrap:anywhere}
.card h2 a{color:inherit;text-decoration:none}
.card h2 a:hover{color:var(--accent)}
.tag{font-size:13px;color:var(--ink2);margin:0 0 5px;overflow-wrap:anywhere}
.addr{font-size:12.5px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.badges{display:flex;flex-wrap:wrap;gap:5px;padding:0 13px 10px}
.b{font-size:11.5px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.b.veg{background:var(--good-soft);color:var(--good)}
.b.mich{background:#241f1a;color:#f0c674}
.b.new{background:#e8eef7;color:#2c4f86}
.foot{margin-top:auto;display:flex;align-items:center;gap:8px;padding:11px 13px;border-top:1px solid var(--line);
  flex-wrap:wrap}
/* Az ar es az ertekeles egy blokk: igy szuk kartyanal a ket gomb egyben tor at
   a kovetkezo sorba, nem egyesevel, es nem log ki a kartyabol. */
.foot .pr{display:flex;align-items:baseline;gap:8px;flex:1 1 auto;min-width:0}
.price{font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.stars{font-size:12.5px;color:var(--star);font-weight:700;white-space:nowrap}
.stars span{color:var(--muted);font-weight:500}
.btn{font:600 13px var(--sans);text-decoration:none;padding:7px 12px;border-radius:9px;border:1px solid var(--line);color:var(--ink2)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
/* Etel-talalat jelolese. Szandekosan MAS, mint a jelvenyek: nem pirula, hanem
   egy alahuzott sor tanyer-jellel, hogy ranezesre latszodjon, ez a menuben van. */
.hit{display:flex;gap:7px;align-items:flex-start;margin:7px 0 0;padding:7px 9px;
  background:#fdf6e6;border-left:3px solid var(--star);border-radius:0 8px 8px 0;
  font-size:12.5px;color:#6b5320}
.hit b{color:#3d2f0f;background:#f6e2a8;border-radius:3px;padding:0 2px}
.hit .lbl{flex:none;font-weight:700}
.chip.food{border-style:dashed;border-color:var(--star);color:#7a5f18}
.chip.food.on{background:var(--star);border-color:var(--star);border-style:solid;color:#241f1a}
.menu-panel{border-top:1px dashed var(--line);padding:12px 13px 14px;font-size:13.5px;color:var(--ink2);
  background:#fffdfa}
.menu-panel p{margin:0 0 7px}
.menu-panel ul,.menu-panel ol{margin:0 0 8px;padding-left:20px}
.menu-panel li{margin:0 0 3px}
.menu-panel strong{color:var(--ink)}
.menu-panel .orig{display:block;width:fit-content;margin-top:12px;font-size:12.5px;color:var(--accent);text-decoration:none;
  border-bottom:1px solid currentColor}
.menu-panel .note{color:var(--muted);font-style:italic}
.btn.open{background:var(--ink);border-color:var(--ink);color:#fff}
.empty{padding:50px 10px;text-align:center;color:var(--muted)}
.empty button{margin-top:12px;font:inherit;padding:8px 16px;border-radius:999px;border:1px solid var(--line);
  background:var(--card);cursor:pointer;color:var(--ink)}
footer{border-top:1px solid var(--line);padding:16px 0 30px;font-size:12.5px;color:var(--muted)}
/* ---- SZELES KEPERNYO: sor-elrendezes, nem telefonos kartya-racs ----
   Peti 2026-09-23: telefonon maradjon a kartya, gepen ne. Szeles kepernyon a
   harom hasabos kartya-racs csak magas, keskeny oszlopokat csinal, es a kinyitott
   menu egy 320 px-es hasabban olvashatatlan. Ezert 900 px felett EGY oszlop,
   vizszintes sorokkal, es a menu teljes szelessegben nyilik. */
@media (min-width:900px){
  .grid{grid-template-columns:1fr;gap:10px}
  .card{display:grid;grid-template-columns:120px minmax(0,1fr) auto;
        grid-template-areas:"kep torzs oldal" "menu menu menu";
        align-items:center;column-gap:16px}
  .card .top{grid-area:kep;padding:12px 0 12px 12px;display:block}
  .card img{width:120px;height:104px}
  .card .top > div{display:none}
  .card .body{grid-area:torzs;padding:12px 0;min-width:0;display:block}
  .card .badges.narrow-only,.card .hit.narrow-only{display:none}
  .card .body h2{font-size:18px;margin-bottom:2px}
  .card .badges{padding:7px 0 0}
  .card .foot{grid-area:oldal;margin:0;border-top:0;padding:12px 14px 12px 0;
        display:grid;grid-template-columns:auto auto;gap:6px 10px;align-items:center;justify-items:end}
  .card .foot .pr{flex:0 0 auto;grid-column:1 / -1;justify-self:end;gap:10px}
  .card .foot .btn{min-width:112px;text-align:center}
  .menu-panel{grid-area:menu;columns:2;column-gap:34px;padding:14px 16px 18px}
  .menu-panel p,.menu-panel ul{break-inside:avoid}
  .menu-panel .orig{column-span:all}
}
@media (min-width:1280px){ .menu-panel{columns:3} }

@media (max-width:560px){
  .card img{width:74px;height:74px}
  /* Szuk kepernyon az ar-blokk sajat sort kap, a gombok ala kerulnek. */
  .foot .pr{flex:1 0 100%}
  .foot .btn{flex:1 1 auto;text-align:center}
  .meta{gap:6px}
  .meta select{max-width:56vw}
}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Éttermek Hete</h1>
    <p id="sub">Betöltés...</p>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search">
      <span class="ico">&#128269;</span>
      <input id="q" type="search" placeholder="Keress névre, konyhára, utcára, kerületre..." autocomplete="off">
      <button id="clr" type="button" hidden>&times;</button>
    </div>
    <div class="rowscroll" id="chips"></div>
    <div class="rowscroll" id="foodrow">
      <button class="chip food" id="foodbtn" type="button">Keresés az ételek között is</button>
      <span class="chip" id="foodinfo" style="border:0;background:transparent;cursor:default;color:var(--muted)"></span>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="meta">
    <div><b id="cnt">0</b> <span id="cntw">étterem</span></div>
    <label>Rendezés:
      <select id="sort">
        <option value="nev">név szerint</option>
        <option value="ar">ár, olcsóbb elöl</option>
        <option value="ar-desc">ár, drágább elöl</option>
        <option value="ert">értékelés szerint</option>
        <option value="ker">kerület szerint</option>
      </select>
    </label>
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="empty" hidden>
    <div id="emptytxt"></div>
    <button id="reset" type="button">Szűrők törlése</button>
  </div>
</div>

<footer>
  <div class="wrap">
    <p id="src"></p>
    <p>Ez egy saját, kereshető nézet a nyilvános listáról. A foglalás és a menü a szervező oldalán történik.</p>
  </div>
</footer>

<script>
(function(){
  var DATA = [], view = [], F = { ar:null, ker:null, veg:false, all:false, mich:false, uj:false, bor:false };
  var q = '';

  function norm(s){
    return (s||'').toString().toLowerCase()
      .replace(/[áà]/g,'a').replace(/[éè]/g,'e').replace(/[íì]/g,'i')
      .replace(/[óöő]/g,'o').replace(/[úüű]/g,'u').replace(/[^a-z0-9 ]+/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  function ft(n){ return n ? n.toLocaleString('hu-HU') + ' Ft' : ''; }
  function esc(s){ return (s||'').replace(/[&<>"]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function roman(k){
    var R=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV',
           'XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII'];
    return R[k] || k;
  }

  function hasBadge(r, frag){
    for (var i=0;i<r.jelvenyek.length;i++){ if (norm(r.jelvenyek[i]).indexOf(frag) >= 0) return true; }
    return false;
  }

  // --- etel-kereses (opcionalis, kulon kapcsolo) ---
  var FOOD = false, MENUTXT = null;   // slug -> normalizalt menu-szoveg
  // A sima szoveget a SZERVER adja elore dekodolva (menus.json -> szovegek).
  // Kliens-oldalon nem bontunk entitast: ott a &eacute; szokozze valna, es a
  // talalat-reszlet ekezet nelkul, torzitva jelenne meg.
  function buildMenuIndex(szovegek){
    MENUTXT = {};
    for (var k in szovegek){
      MENUTXT[k] = { n: norm(szovegek[k]), raw: szovegek[k] };
    }
  }
  // Az elso talalat korulotti reszlet, a keresett szoval kiemelve.
  function menuHit(r){
    if (!FOOD || !q || !MENUTXT || !MENUTXT[r.slug]) return null;
    // A normalizalt es a nyers szoveg KARAKTERENKENT egy hosszu (a norm csak
    // cserel, nem rovidit a 'replace(/[^a-z0-9 ]+/g," ")' miatt), ezert a
    // normalizaltban talalt pozicio a nyersben is jo.
    var pos = MENUTXT[r.slug].n.indexOf(q.split(' ')[0]);
    if (pos < 0) return null;
    var raw = MENUTXT[r.slug].raw;
    var from = Math.max(0, pos - 45), to = Math.min(raw.length, pos + 95);
    var frag = (from > 0 ? '...' : '') + raw.slice(from, to).trim() + (to < raw.length ? '...' : '');
    return frag;
  }
  function hitHtml(r, narrow){
    var f = menuHit(r);
    if (!f) return '';
    return '<div class="hit' + (narrow ? ' narrow-only' : '') + '">' +
           '<span class="lbl">Az étlapon:</span><span>' + esc(f) + '</span></div>';
  }

  function matchQ(r){
    if (!q) return true;
    var terms = q.split(' ');
    var menu = (FOOD && MENUTXT && MENUTXT[r.slug]) ? MENUTXT[r.slug].n : '';
    for (var i=0;i<terms.length;i++){
      if (r._s.indexOf(terms[i]) < 0 && menu.indexOf(terms[i]) < 0) return false;
    }
    return true;
  }
  function matchF(r, skip){
    if (skip!=='ar'  && F.ar  !== null && r.ar !== F.ar) return false;
    if (skip!=='ker' && F.ker !== null && r.kerulet !== F.ker) return false;
    if (skip!=='veg'  && F.veg  && !r._veg) return false;
    if (skip!=='all'  && F.all  && !r._all) return false;
    if (skip!=='mich' && F.mich && !r._mich) return false;
    if (skip!=='uj'   && F.uj   && !r._uj) return false;
    if (skip!=='bor'  && F.bor  && !r._bor) return false;
    return true;
  }
  function pass(r){ return matchQ(r) && matchF(r); }

  function card(r){
    var b = '';
    if (r._mich) b += '<span class="b mich">Michelin</span>';
    if (r._veg)  b += '<span class="b veg">Vegetáriánus</span>';
    if (r._all)  b += '<span class="b">Allergén info</span>';
    if (r._bor)  b += '<span class="b">Boritalajánlat</span>';
    if (r._uj)   b += '<span class="b new">Új résztvevő</span>';
    var hely = r.kerulet ? (roman(r.kerulet) + '. kerület') : esc(r.telepules || '');
    // A cim vegen ott van az iranyitoszam + telepules is, amit a hely mar elmond.
    // Levagjuk, hogy ne "II. kerulet . Szell Kalman ter 5. 1024 Budapest" legyen.
    var utca = (r.cim || '').replace(/\s*\d{4}\s+[^,]*$/, '').trim();
    var st = r.ertekeles
      ? '<div class="stars">&#9733; ' + r.ertekeles.toFixed(1).replace('.',',') +
        ' <span>(' + r.ertekelesek_szama + ')</span></div>'
      : '<div class="stars"><span>nincs értékelés</span></div>';
    return '<article class="card">' +
      '<div class="top">' +
        (r.kep ? '<img loading="lazy" src="' + esc(r.kep) + '" alt="">' : '<img alt="">') +
        '<div class="body-narrow">' +
          '<h2><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.nev) + '</a></h2>' +
          (r.leiras ? '<p class="tag">' + esc(r.leiras) + '</p>' : '') +
          '<p class="addr">' + hely + (utca ? ' &middot; ' + esc(utca) : '') + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="body">' +
        '<h2><a href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(r.nev) + '</a></h2>' +
        (r.leiras ? '<p class="tag">' + esc(r.leiras) + '</p>' : '') +
        '<p class="addr">' + hely + (utca ? ' &middot; ' + esc(utca) : '') + '</p>' +
        (b ? '<div class="badges">' + b + '</div>' : '') +
        hitHtml(r) +
      '</div>' +
      (b ? '<div class="badges narrow-only">' + b + '</div>' : '') +
      hitHtml(r, true) +
      '<div class="foot">' +
        '<div class="pr"><span class="price">' + ft(r.ar) + '</span>' + st + '</div>' +
        (r.menu_url ? '<button class="btn menu-btn" type="button" data-slug="' + esc(r.slug) + '">Menü</button>' : '') +
        (r.foglalas_url ? '<a class="btn main" href="' + esc(r.foglalas_url) + '" target="_blank" rel="noopener">Foglalás</a>' : '') +
      '</div>' +
      '<div class="menu-panel" id="mp_' + esc(r.slug) + '" hidden></div>' +
    '</article>';
  }

  function chipDefs(){
    var arak = {}, kerek = {};
    DATA.forEach(function(r){
      if (r.ar) arak[r.ar] = 1;
      if (r.kerulet) kerek[r.kerulet] = 1;
    });
    var out = [];
    Object.keys(arak).map(Number).sort(function(a,b){return a-b;}).forEach(function(a){
      out.push({ k:'ar', v:a, label: ft(a) });
    });
    out.push({ k:'veg',  v:true, label:'Vegetáriánus' });
    out.push({ k:'all',  v:true, label:'Allergén info' });
    out.push({ k:'mich', v:true, label:'Michelin' });
    out.push({ k:'bor',  v:true, label:'Boritalajánlat' });
    out.push({ k:'uj',   v:true, label:'Új résztvevő' });
    Object.keys(kerek).map(Number).sort(function(a,b){return a-b;}).forEach(function(k){
      out.push({ k:'ker', v:k, label: roman(k) + '. ker.' });
    });
    return out;
  }

  function countIf(def){
    // hany talalat lenne, ha EZT a szurot (is) bekapcsolnank
    var n = 0;
    for (var i=0;i<DATA.length;i++){
      var r = DATA[i];
      if (!matchQ(r)) continue;
      if (!matchF(r, def.k)) continue;
      if (def.k==='ar'  && r.ar !== def.v) continue;
      if (def.k==='ker' && r.kerulet !== def.v) continue;
      if (def.k==='veg'  && !r._veg) continue;
      if (def.k==='all'  && !r._all) continue;
      if (def.k==='mich' && !r._mich) continue;
      if (def.k==='uj'   && !r._uj) continue;
      if (def.k==='bor'  && !r._bor) continue;
      n++;
    }
    return n;
  }

  function drawChips(){
    var defs = chipDefs(), h = '';
    defs.forEach(function(d, i){
      var on = (d.k==='ar' || d.k==='ker') ? F[d.k] === d.v : F[d.k] === true;
      var n = countIf(d);
      h += '<button class="chip' + (on ? ' on' : '') + (n===0 && !on ? ' zero' : '') +
           '" data-i="' + i + '">' + d.label + '<span class="n">' + n + '</span></button>';
    });
    document.getElementById('chips').innerHTML = h;
    document.getElementById('chips')._defs = defs;
  }

  function sortView(){
    var s = document.getElementById('sort').value;
    view.sort(function(a,b){
      if (s==='ar')      return (a.ar||0) - (b.ar||0) || a.nev.localeCompare(b.nev,'hu');
      if (s==='ar-desc') return (b.ar||0) - (a.ar||0) || a.nev.localeCompare(b.nev,'hu');
      if (s==='ert')     return (b.ertekeles||0) - (a.ertekeles||0) ||
                                (b.ertekelesek_szama||0) - (a.ertekelesek_szama||0);
      if (s==='ker')     return (a.kerulet||99) - (b.kerulet||99) || a.nev.localeCompare(b.nev,'hu');
      return a.nev.localeCompare(b.nev,'hu');
    });
  }

  // #menu=<slug> esetén megnyitjuk azt a menüt. Igy egy konkret etterem menuje
  // linkelheto, es a rendereles is ellenorizheto kattintas nelkul.
  function openFromHash(){
    var h = location.hash || '';
    var m = /^#menu=(.+)$/.exec(h);
    if (m){
      var b = document.querySelector('.menu-btn[data-slug="' + m[1].replace(/"/g,'') + '"]');
      if (b) { b.click(); b.scrollIntoView({block:'center'}); }
      return;
    }
    // #etel=<szo>: etel-kereses bekapcsolva, a szoval kitoltve. Igy egy konkret
    // fogas keresese linkkent megoszthato.
    var e = /^#etel=(.+)$/.exec(h);
    if (e){
      var szo = decodeURIComponent(e[1]);
      document.getElementById('q').value = szo;
      q = norm(szo);
      document.getElementById('clr').hidden = false;
      document.getElementById('foodbtn').click();
    }
  }

  function render(){
    view = DATA.filter(pass);
    sortView();
    document.getElementById('cnt').textContent = view.length;
    document.getElementById('cntw').textContent = view.length === 1 ? 'étterem' : 'étterem';
    document.getElementById('grid').innerHTML = view.map(card).join('');
    var e = document.getElementById('empty');
    if (view.length === 0){
      e.hidden = false;
      document.getElementById('emptytxt').textContent = q
        ? 'Erre a keresésre nincs találat: ' + q
        : 'Ennyi szűrővel egyetlen étterem sem marad. Kapcsolj ki egyet.';
    } else { e.hidden = true; }
    drawChips();
  }

  // --- menuk: lustan toltunk, csak az elso megnyitaskor ---
  var MENUS = null, menusLoading = null;
  function loadMenus(){
    if (MENUS) return Promise.resolve(MENUS);
    if (menusLoading) return menusLoading;
    menusLoading = fetch('/etteremhet/data/menus.json')
      .then(function(r){ if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){ MENUS = d.menuk || {}; MENUS._szovegek = d.szovegek || {}; return MENUS; });
    return menusLoading;
  }

  document.getElementById('grid').addEventListener('click', function(ev){
    var b = ev.target.closest('.menu-btn'); if (!b) return;
    var slug = b.dataset.slug, panel = document.getElementById('mp_' + slug);
    if (!panel) return;
    if (!panel.hidden){ panel.hidden = true; b.classList.remove('open'); b.textContent = 'Menü'; return; }
    panel.hidden = false; b.classList.add('open'); b.textContent = 'Menü elrejtése';
    if (panel.dataset.done) return;
    panel.innerHTML = '<p class="note">Menü betöltése...</p>';
    var rec = null;
    for (var i=0;i<DATA.length;i++){ if (DATA[i].slug === slug){ rec = DATA[i]; break; } }
    loadMenus().then(function(m){
      panel.dataset.done = '1';
      var body = m[slug];
      var orig = rec && rec.menu_url
        ? '<a class="orig" href="' + esc(rec.menu_url) + '" target="_blank" rel="noopener">Megnyitás az eredeti oldalon</a>'
        : '';
      panel.innerHTML = body
        ? body + orig
        : '<p class="note">Ehhez az étteremhez nem sikerült lehozni a menüt.</p>' + orig;
    }).catch(function(e){
      panel.dataset.done = '';
      panel.innerHTML = '<p class="note">A menük most nem érhetők el (' + esc(e.message) + ').</p>';
    });
  });

  document.getElementById('chips').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-i]'); if (!b) return;
    var d = this._defs[+b.dataset.i];
    if (d.k==='ar' || d.k==='ker') F[d.k] = (F[d.k] === d.v) ? null : d.v;
    else F[d.k] = !F[d.k];
    render();
  });
  var foodbtn = document.getElementById('foodbtn'), foodinfo = document.getElementById('foodinfo');
  foodbtn.addEventListener('click', function(){
    if (FOOD){ FOOD = false; this.classList.remove('on'); foodinfo.textContent = ''; render(); return; }
    var self = this;
    self.classList.add('on'); foodinfo.textContent = 'menük betöltése...';
    loadMenus().then(function(m){
      if (!MENUTXT) buildMenuIndex(m._szovegek || {});
      FOOD = true;
      foodinfo.textContent = 'az étlapok szövegében is keresünk';
      render();
    }).catch(function(e){
      self.classList.remove('on');
      foodinfo.textContent = 'a menük most nem érhetők el';
    });
  });

  var qi = document.getElementById('q'), clr = document.getElementById('clr');
  qi.addEventListener('input', function(){
    q = norm(this.value); clr.hidden = !this.value; render();
  });
  clr.addEventListener('click', function(){ qi.value=''; q=''; this.hidden=true; render(); qi.focus(); });
  document.getElementById('sort').addEventListener('change', render);
  document.getElementById('reset').addEventListener('click', function(){
    F = { ar:null, ker:null, veg:false, all:false, mich:false, uj:false, bor:false };
    qi.value=''; q=''; clr.hidden=true; render();
  });

  // ABSZOLUT ut, szandekosan. A /etteremhet cim zaro perjel NELKUL erkezik
  // (vercel.json trailingSlash:false), ezert a relativ 'data/...' a GYOKERHEZ
  // kepest oldodna fel (/data/restaurants.json), ami mas mappa es 404.
  fetch('/etteremhet/data/restaurants.json').then(function(r){ return r.json(); }).then(function(d){
    DATA = d.ettermek.map(function(r){
      r._veg  = hasBadge(r, 'vegetarianus');
      r._all  = hasBadge(r, 'allergen');
      r._mich = hasBadge(r, 'michelin');
      r._uj   = hasBadge(r, 'uj resztvevo');
      r._bor  = hasBadge(r, 'bor');
      r._s = norm([r.nev, r.leiras, r.cim, r.telepules,
                   r.kerulet ? roman(r.kerulet) + '. kerulet ' + r.kerulet + ' kerulet' : '',
                   r.jelvenyek.join(' ')].join(' '));
      return r;
    });
    var ker = {}; DATA.forEach(function(r){ if (r.kerulet) ker[r.kerulet]=1; });
    document.getElementById('sub').textContent =
      d.db + ' étterem, ' + Object.keys(ker).length + ' budapesti kerületben és az agglomerációban';
    document.getElementById('src').textContent =
      'Forrás: ' + d.forras + '. Letöltve: ' + d.letoltve + '. Az árak és a kínálat a szervezőnél változhatnak.';
    render();
    openFromHash();
  }).catch(function(e){
    document.getElementById('sub').textContent = 'Az adatok nem töltődtek be.';
    document.getElementById('emptytxt').textContent = 'Hiba: ' + e.message;
    document.getElementById('empty').hidden = false;
  });
})();
</script>
</body>
</html>
