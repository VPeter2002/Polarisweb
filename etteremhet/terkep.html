<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Éttermek Hete, térkép</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --papir:#f4efe6; --lap:#fbf8f3; --tinta:#1f1b16; --tinta2:#4a4139; --halvany:#8b7f70;
  --vonal:#ddd2c2; --vonal2:#c9bba6; --piros:#8a2b20; --arany:#a8801f; --zold:#3f6b4a;
  --serif:'Instrument Serif',Georgia,serif; --sans:'Work Sans',system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--papir);color:var(--tinta);font-family:var(--sans);font-size:15px;
  display:flex;flex-direction:column}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px;width:100%}
header{padding:20px 0 14px;border-bottom:2px solid var(--tinta);flex:none}
header .wrap{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap}
header h1{margin:0;font-family:var(--serif);font-weight:400;font-size:clamp(26px,4.4vw,40px);
  line-height:1;letter-spacing:-.015em}
header h1 em{font-style:italic;color:var(--piros)}
header a.back{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--piros);
  text-decoration:none;border-bottom:1px solid currentColor}
.bar{flex:none;border-bottom:1px solid var(--vonal);padding:11px 0}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{display:flex;gap:8px;align-items:center;border-bottom:2px solid var(--tinta);
  padding:3px 2px 5px;flex:1 1 260px;min-width:0}
.search input{border:0;outline:0;font:400 17px/1.3 var(--serif);flex:1;background:transparent;
  color:var(--tinta);min-width:0}
.search input::placeholder{color:var(--halvany);font-style:italic}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--vonal2);background:transparent;border-radius:2px;padding:5px 11px;
  font:500 12px var(--sans);letter-spacing:.03em;color:var(--tinta2);cursor:pointer}
.chip.on{background:var(--tinta);border-color:var(--tinta);color:var(--papir)}
.cnt{font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--halvany);
  margin-left:auto;white-space:nowrap}
#map{flex:1 1 auto;min-height:320px;background:var(--vonal)}
.leaflet-container{font-family:var(--sans);background:#e9e2d5}
.pin{border-radius:50%;border:2px solid var(--lap);box-shadow:0 1px 4px rgba(0,0,0,.35)}
.pop h3{margin:0 0 2px;font-family:var(--serif);font-weight:400;font-size:19px;line-height:1.15}
.pop h3 a{color:var(--tinta);text-decoration:none}
.pop .meta{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--halvany);
  margin:0 0 7px}
.pop .ar{font-family:var(--serif);font-size:18px}
.pop .st{font-size:12px;color:var(--arany);margin-left:8px}
.pop .btns{margin-top:9px;display:flex;gap:7px}
.pop a.b{font:500 11px var(--sans);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;
  padding:6px 11px;border:1px solid var(--vonal2);border-radius:2px;color:var(--tinta2)}
.pop a.b.main{background:var(--piros);border-color:var(--piros);color:var(--lap)}
footer{flex:none;border-top:1px solid var(--vonal);padding:10px 0 14px;font-size:11px;
  color:var(--halvany);letter-spacing:.03em}
.legend{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;
  vertical-align:-1px;border:1px solid rgba(0,0,0,.2)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <h1>Éttermek Hete <em>térkép</em></h1>
    <a class="back" href="/etteremhet">Vissza a listához</a>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="search">
      <span>&#128269;</span>
      <input id="q" type="search" placeholder="Keress névre, utcára..." autocomplete="off">
    </div>
    <div class="chips" id="chips"></div>
    <div class="cnt" id="cnt"></div>
  </div>
</div>

<div id="map"></div>

<footer>
  <div class="wrap legend" id="legend"></div>
</footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  var SZIN = { 6900:'#3f6b4a', 8900:'#a8801f', 10900:'#8a2b20', 17900:'#1f1b16' };
  var DATA = [], COORD = {}, markers = [], layer, map, F = { ar:null }, q = '';

  function norm(s){
    return (s||'').toString().toLowerCase()
      .replace(/[áà]/g,'a').replace(/[éè]/g,'e').replace(/[íì]/g,'i')
      .replace(/[óöő]/g,'o').replace(/[úüű]/g,'u').replace(/[^a-z0-9 ]+/g,' ')
      .replace(/\s+/g,' ').trim();
  }
  function esc(s){ return (s||'').replace(/[&<>"]/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function ft(n){ return n ? n.toLocaleString('hu-HU') + ' Ft' : ''; }
  function roman(k){
    var R=['','I','II','III','IV','V','VI','VII','VIII','IX','X','XI','XII','XIII','XIV','XV',
           'XVI','XVII','XVIII','XIX','XX','XXI','XXII','XXIII'];
    return R[k]||k;
  }

  function pass(r){
    if (F.ar !== null && r.ar !== F.ar) return false;
    if (!q) return true;
    var t = q.split(' ');
    for (var i=0;i<t.length;i++){ if (r._s.indexOf(t[i]) < 0) return false; }
    return true;
  }

  function popup(r){
    var hely = r.kerulet ? roman(r.kerulet)+'. kerület' : esc(r.telepules||'');
    return '<div class="pop">' +
      '<h3><a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+esc(r.nev)+'</a></h3>' +
      '<p class="meta">'+hely+(r.cim ? ' &middot; '+esc(r.cim) : '')+'</p>' +
      '<div><span class="ar">'+ft(r.ar)+'</span>' +
      (r.ertekeles ? '<span class="st">&#9733; '+r.ertekeles.toFixed(1).replace('.',',')+
        ' ('+r.ertekelesek_szama+')</span>' : '') + '</div>' +
      '<div class="btns">' +
        '<a class="b" href="/etteremhet#menu='+esc(r.slug)+'">Menü</a>' +
        (r.foglalas_url ? '<a class="b main" href="'+esc(r.foglalas_url)+'" target="_blank" rel="noopener">Foglalás</a>' : '') +
      '</div></div>';
  }

  function draw(){
    if (layer) layer.clearLayers();
    var n = 0;
    DATA.forEach(function(r){
      var c = COORD[r.slug];
      if (!c || !pass(r)) return;
      n++;
      var szin = SZIN[r.ar] || '#4a4139';
      L.circleMarker([c.lat, c.lon], {
        radius: 7, color: '#fbf8f3', weight: 2, fillColor: szin, fillOpacity: .95, className: 'pin'
      }).bindPopup(popup(r), {maxWidth:280}).addTo(layer);
    });
    document.getElementById('cnt').textContent = n + ' hely a térképen';
  }

  function chips(){
    var arak = {};
    DATA.forEach(function(r){ if (r.ar && COORD[r.slug]) arak[r.ar]=1; });
    var el = document.getElementById('chips'), h = '';
    Object.keys(arak).map(Number).sort(function(a,b){return a-b;}).forEach(function(a){
      h += '<button class="chip'+(F.ar===a?' on':'')+'" data-ar="'+a+'">'+ft(a)+'</button>';
    });
    el.innerHTML = h;
    var lg = '';
    Object.keys(arak).map(Number).sort(function(a,b){return a-b;}).forEach(function(a){
      lg += '<span><i style="background:'+(SZIN[a]||'#4a4139')+'"></i>'+ft(a)+'</span>';
    });
    document.getElementById('legend').innerHTML = lg +
      '<span id="hiany"></span>';
  }

  map = L.map('map', { scrollWheelZoom: true }).setView([47.4979, 19.0555], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19, attribution: '&copy; OpenStreetMap'
  }).addTo(map);
  layer = L.layerGroup().addTo(map);

  document.getElementById('chips').addEventListener('click', function(ev){
    var b = ev.target.closest('[data-ar]'); if (!b) return;
    var a = +b.dataset.ar;
    F.ar = (F.ar === a) ? null : a;
    chips(); draw();
  });
  document.getElementById('q').addEventListener('input', function(){ q = norm(this.value); draw(); });

  Promise.all([
    fetch('/etteremhet/data/restaurants.json').then(function(r){ return r.json(); }),
    fetch('/etteremhet/data/coords.json').then(function(r){ return r.json(); })
  ]).then(function(res){
    DATA = res[0].ettermek.map(function(r){
      r._s = norm([r.nev, r.leiras, r.cim, r.telepules].join(' '));
      return r;
    });
    COORD = res[1].koordinatak || {};
    chips(); draw();
    var hiany = DATA.length - Object.keys(COORD).length;
    document.getElementById('hiany').textContent = hiany > 0
      ? (hiany + ' étterem címét nem tudtuk pontra tenni, azok a listában vannak')
      : '';
    var pts = DATA.filter(function(r){ return COORD[r.slug]; })
                  .map(function(r){ return [COORD[r.slug].lat, COORD[r.slug].lon]; });
    if (pts.length) map.fitBounds(pts, { padding: [30,30] });
  }).catch(function(e){
    document.getElementById('cnt').textContent = 'Az adatok nem töltődtek be: ' + e.message;
  });
})();
</script>
</body>
</html>
