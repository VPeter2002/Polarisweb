<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0d0f14">
<title>Társasági naptár</title>
<meta name="description" content="Közös naptár a társaságnak: események, emlékeztetők, privát és közös programok.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='26' fill='%23e0a458'/><rect x='24' y='30' width='52' height='44' rx='7' fill='none' stroke='%2317120a' stroke-width='7'/><path d='M24 44h52M38 24v12M62 24v12' stroke='%2317120a' stroke-width='7' stroke-linecap='round'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/demok/naptar/assets/app.css">
</head>
<body>

<!-- BELEPES -->
<div class="auth" id="authView" hidden>
  <div class="auth-card">
    <div class="auth-mark">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#17120a" stroke-width="2" stroke-linecap="round"><rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>
    </div>
    <h1 id="authTitle">Társasági naptár</h1>
    <p class="sub" id="authSub">Add meg az e-mail címed, és küldünk egy belépési kódot. Jelszó nincs, és elég egyszer belépned.</p>

    <div id="authError" class="err" hidden></div>

    <!-- 1. lepes -->
    <div id="stepEmail">
      <div class="field">
        <label for="email">E-mail cím</label>
        <input class="input" id="email" type="email" autocomplete="email" placeholder="te@example.com" inputmode="email">
      </div>
      <div class="field" id="newFields" hidden>
        <label for="nev">A neved</label>
        <input class="input" id="nev" type="text" autocomplete="name" placeholder="Ahogy a többiek hívnak">
      </div>
      <div class="field" id="inviteField" hidden>
        <label for="meghivo">Meghívó kód</label>
        <input class="input" id="meghivo" type="text" autocomplete="off" placeholder="Amit a társaságtól kaptál">
      </div>
      <button class="btn btn-full" id="sendCode">Kódot kérek</button>
      <p class="note" id="authNote">A kód 15 percig él. Ha egyszer beléptél, ezen az eszközön bejelentkezve maradsz, nem kell újra kódot kérned.</p>
      <p class="note" id="modeSwitch">Még nem regisztráltál? <button class="link-btn" id="toRegister">Kattints ide</button></p>
    </div>

    <!-- 2. lepes -->
    <div id="stepCode" hidden>
      <div class="field"><label>A hat jegyű kód</label></div>
      <div class="code-row" id="codeRow">
        <input inputmode="numeric" maxlength="1" aria-label="1. jegy">
        <input inputmode="numeric" maxlength="1" aria-label="2. jegy">
        <input inputmode="numeric" maxlength="1" aria-label="3. jegy">
        <input inputmode="numeric" maxlength="1" aria-label="4. jegy">
        <input inputmode="numeric" maxlength="1" aria-label="5. jegy">
        <input inputmode="numeric" maxlength="1" aria-label="6. jegy">
      </div>
      <button class="btn btn-full" id="verifyCode">Belépés</button>
      <p class="note"><button class="link-btn" id="backToEmail">Másik címmel lépnék be</button></p>
    </div>
  </div>
</div>

<!-- ALKALMAZAS -->
<div id="appView" hidden>
  <header class="topbar">
    <div class="wrap topbar-in">
      <div class="brand">
        <span class="brand-mark">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#17120a" stroke-width="2.2" stroke-linecap="round"><rect x="3.5" y="5.5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8.5 3v4M15.5 3v4"/></svg>
        </span>
        <span class="brand-name" id="appTitle">Társasági naptár</span>
      </div>
      <button class="avatar" id="meBtn" title="Kilépés"></button>
    </div>
  </header>

  <main class="wrap">
    <div class="controls">
      <div class="month-nav">
        <button class="icon-btn" id="prevBtn" aria-label="Előző hónap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <button class="icon-btn" id="nextBtn" aria-label="Következő hónap">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
      <h2 class="month-title" id="monthTitle"></h2>
      <button class="chip" id="todayBtn">Ma</button>
      <div class="spacer"></div>
      <div class="seg" id="viewSeg">
        <button data-view="month" class="on">Hónap</button>
        <button data-view="list">Lista</button>
      </div>
    </div>

    <div class="filters" id="filters">
      <button class="chip" data-filter="mine">Amiben benne vagyok</button>
      <button class="chip tag-boys" data-filter="only_boys">Only boys</button>
      <button class="chip tag-girls" data-filter="boys_and_girls">Boys and girls</button>
      <button class="chip" data-filter="privat">Privát</button>
      <button class="chip" data-filter="nem_megyek">Nem megyek</button>
      <button class="chip" data-filter="nincs_valasz">Nem jeleztem vissza</button>
    </div>

    <div id="monthView">
      <div class="dow"><div>Hét</div><div>Ked</div><div>Sze</div><div>Csü</div><div>Pén</div><div>Szo</div><div>Vas</div></div>
      <div class="grid" id="grid"></div>
    </div>

    <div id="listView" class="list" hidden></div>
  </main>

  <button class="fab" id="newBtn" aria-label="Új esemény">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script src="/demok/naptar/assets/app.js"></script>
</body>
</html>
