<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<title>Need To Pee | Public toilets in Budapest</title>
<meta name="description" content="Every public toilet in Budapest on one map. Free or paid, open now, wheelchair accessible, baby changing. Works offline.">
<meta name="theme-color" content="#0d9488">
<meta name="robots" content="noindex">
<link rel="manifest" href="/demok/needtopee/manifest.webmanifest">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root{
    --bg:#f6f7f6; --card:#fff; --ink:#15211f; --ink-2:#3c4a47; --muted:#6b7a77;
    --line:#e2e7e5; --brand:#0d9488; --brand-dark:#0f766e; --free:#15803d; --paid:#b45309; --nodata:#6b7a77;
    --shadow:0 10px 30px -18px rgba(14,30,28,.45);
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);-webkit-tap-highlight-color:transparent}
  header{position:sticky;top:0;z-index:600;background:var(--card);border-bottom:1px solid var(--line)}
  .bar{display:flex;align-items:center;gap:10px;padding:10px 14px;max-width:1100px;margin:0 auto}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;letter-spacing:-.02em}
  .logo span.dot{width:26px;height:26px;border-radius:8px;background:var(--brand);display:grid;place-items:center;color:#fff;font-size:15px}
  .spacer{flex:1}
  .lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
  .lang button{border:0;background:var(--card);color:var(--muted);font:600 12.5px var(--sans);padding:7px 11px;cursor:pointer}
  .lang button.on{background:var(--ink);color:#fff}
  .filters{display:flex;gap:8px;overflow-x:auto;padding:10px 14px;max-width:1100px;margin:0 auto;scrollbar-width:none}
  .filters::-webkit-scrollbar{display:none}
  .chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font:600 13px var(--sans);color:var(--ink-2);cursor:pointer}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  main{max-width:1100px;margin:0 auto;padding:0 14px 90px}
  #map{height:44vh;min-height:260px;border-radius:14px;margin:4px 0 14px;border:1px solid var(--line);box-shadow:var(--shadow)}
  .meta{display:flex;align-items:baseline;gap:8px;margin:0 0 10px;font-size:13px;color:var(--muted)}
  .meta strong{color:var(--ink);font-size:15px}
  .list{display:grid;gap:10px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
  .item h3{margin:0 0 4px;font-size:16px;font-weight:700;line-height:1.3}
  .item .where{font-size:13px;color:var(--muted);margin:0 0 10px}
  .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
  .t{font:600 12px var(--sans);padding:4px 9px;border-radius:999px;background:#eef2f1;color:var(--ink-2)}
  .t.free{background:#dcfce7;color:var(--free)}
  .t.paid{background:#fef3c7;color:var(--paid)}
  .t.nodata{background:#eef2f1;color:var(--nodata);font-style:italic}
  .t.warn{background:#fee2e2;color:#b91c1c}
  .t.ok{background:#e0f2fe;color:#0369a1}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .btn{flex:1 1 auto;text-align:center;text-decoration:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:10px 12px;font:600 13.5px var(--sans);cursor:pointer}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
  .btn:active{transform:scale(.98)}
  .report{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
  .report .lbl{font-size:12px;color:var(--muted);margin-bottom:6px}
  .report .row .btn{flex:1;font-size:12.5px;padding:8px 6px}
  .said{font-size:12px;color:var(--brand-dark);margin-top:8px;font-weight:600}
  .empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted)}
  footer{max-width:1100px;margin:0 auto;padding:22px 14px 40px;font-size:12px;color:var(--muted);line-height:1.6}
  footer a{color:var(--brand-dark)}
  .locbar{position:fixed;left:0;right:0;bottom:0;z-index:700;background:var(--card);border-top:1px solid var(--line);padding:10px 14px;display:flex;gap:8px;max-width:1100px;margin:0 auto}
  .locbar .btn{flex:1}
  @media (min-width:820px){
    #map{height:48vh}
    .list{grid-template-columns:repeat(2,1fr)}
    .locbar{position:static;border:0;background:none;padding:0 0 16px}
  }

  /* ================= ELEVATION PASS ================= */
  /* Additive interactivity & motion layer. Colors/type/layout language unchanged. */
  :root{
    --ease-out: cubic-bezier(.2,.7,.2,1);
  }

  .tagline{max-width:1100px;margin:0 auto;padding:0 14px 8px;font-size:12px;color:var(--muted);font-style:italic}

  .searchbar{max-width:1100px;margin:0 auto;padding:0 14px 10px}
  .searchField{position:relative;display:flex;align-items:center}
  .searchField .searchIcon{position:absolute;left:13px;font-size:14px;opacity:.55;pointer-events:none}
  .searchField input{width:100%;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 44px 0 36px;font:600 14px var(--sans);color:var(--ink);background:#fff;transition:border-color .18s var(--ease-out),box-shadow .18s var(--ease-out)}
  .searchField input:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(13,148,136,.15)}
  .searchField input::placeholder{color:var(--muted)}
  .searchField input:disabled{opacity:.55}
  .searchField input::-webkit-search-cancel-button{display:none}
  .searchClearBtn{position:absolute;right:0;top:0;width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;padding:0}
  .searchClearBtn .x{width:24px;height:24px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:15px;line-height:1;color:var(--ink-2);transition:background .15s var(--ease-out),transform .15s var(--ease-out)}
  .searchClearBtn:hover .x{background:#d7dedb}
  .searchClearBtn:active .x{transform:scale(.85)}

  .chip{position:relative;transition:transform .15s var(--ease-out),box-shadow .18s var(--ease-out)}
  .chip:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(14,30,28,.35)}
  .chip:active{transform:translateY(0) scale(.97)}
  .chip .cnt{margin-left:5px;font-weight:800;opacity:.7;font-variant-numeric:tabular-nums}
  .chip.on .cnt{opacity:.9}
  .chip.zero{opacity:.5}

  .toolbar{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;margin:0 0 10px}
  .toolbar .meta{margin:0}
  #countNum{font-variant-numeric:tabular-nums;display:inline-block;min-width:1ch}
  .sortbar{display:flex;gap:6px;flex-wrap:wrap}
  .sortbtn{border:1px solid var(--line);background:var(--card);color:var(--ink-2);border-radius:999px;padding:6px 12px;font:600 12px var(--sans);cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:4px;transition:transform .15s var(--ease-out),background .15s var(--ease-out),color .15s var(--ease-out),border-color .15s var(--ease-out)}
  .sortbtn.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .sortbtn:hover{transform:translateY(-1px)}
  .sortbtn:active{transform:translateY(0) scale(.96)}

  @keyframes cardIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
  .item{transition:transform .2s var(--ease-out),box-shadow .2s var(--ease-out);animation:cardIn .38s var(--ease-out) both;animation-delay:var(--reveal-delay,0ms);cursor:pointer}
  .item:hover{transform:translateY(-4px);box-shadow:0 20px 34px -18px rgba(14,30,28,.4)}
  .item:active{transform:translateY(-1px) scale(.995)}
  .item.item-focus{outline:2px solid var(--brand);outline-offset:2px;animation:focusPulse 1.4s var(--ease-out)}
  @keyframes focusPulse{0%{box-shadow:0 0 0 0 rgba(13,148,136,.45)}70%{box-shadow:0 0 0 14px rgba(13,148,136,0)}100%{box-shadow:0 0 0 0 rgba(13,148,136,0)}}

  .report .btn{transition:transform .15s var(--ease-out),background .15s var(--ease-out),color .15s var(--ease-out),border-color .15s var(--ease-out)}
  .report .btn.picked{animation:pop .32s var(--ease-out)}
  .report .btn.picked[data-rep="ok"]{background:#dcfce7;border-color:#bbf0cd;color:var(--free)}
  .report .btn.picked[data-rep="closed"]{background:#fef3c7;border-color:#fde7a8;color:var(--paid)}
  .report .btn.picked[data-rep="bad"]{background:#fee2e2;border-color:#fbd0d0;color:#b91c1c}
  @keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.08)}100%{transform:scale(1)}}

  .btn.primary:hover{box-shadow:0 10px 20px -10px rgba(13,148,136,.55)}

  .empty{animation:cardIn .4s var(--ease-out) both}
  .emptyIcon{font-size:34px;margin-bottom:6px}
  .empty p{margin:0 0 4px}
  .resetBtn{margin:14px auto 0;display:inline-block;max-width:240px}

  .skeleton{background:linear-gradient(100deg,var(--card) 30%,#eef2f1 50%,var(--card) 70%);background-size:200% 100%;animation:shimmer 1.3s ease-in-out infinite;border:1px solid var(--line);border-radius:14px;height:132px}
  @keyframes shimmer{0%{background-position:0 0}100%{background-position:-200% 0}}

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
    .item{animation:none!important;opacity:1!important;transform:none!important}
    .item:hover{transform:none!important}
    .skeleton{animation:none!important}
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <div class="logo"><span class="dot">💧</span> Need To Pee</div>
    <div class="spacer"></div>
    <div class="lang">
      <button id="langEn" class="on">EN</button>
      <button id="langHu">HU</button>
    </div>
  </div>
  <div class="tagline" id="tagline"></div>
  <div class="searchbar">
    <div class="searchField">
      <span class="searchIcon" aria-hidden="true">🔎</span>
      <input type="search" id="search" autocomplete="off" spellcheck="false" disabled>
      <button class="searchClearBtn" id="searchClear" type="button" hidden><span class="x">×</span></button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main>
  <div id="map"></div>
  <div class="toolbar">
    <div class="meta" id="meta"></div>
    <div class="sortbar" id="sortbar"></div>
  </div>
  <div class="list" id="list"></div>
  <div class="empty" id="empty" hidden></div>
</main>

<div class="locbar">
  <button class="btn primary" id="locBtn"></button>
</div>

<footer id="footer"></footer>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
(function(){
  'use strict';
  var BASE = location.pathname.indexOf('/demok/needtopee') === 0 ? '/demok/needtopee' : '';

  var T = {
    en: {
      near: 'Use my location', locating: 'Locating…', denied: 'Location denied, showing all',
      count: function(n, t){ return n + ' of ' + t + ' toilets'; },
      sortedNear: 'closest first', sortedAll: 'no location yet',
      f_open: 'Open now', f_free: 'Free', f_step: 'No purchase needed', f_wc: 'Wheelchair', f_baby: 'Baby changing',
      free: 'Free', paid: 'Paid', fee_unknown: 'Price unknown', customers: 'Customers only',
      wc_yes: 'Wheelchair accessible', wc_no: 'Not accessible', wc_lim: 'Partly accessible', wc_unknown: 'Accessibility unknown',
      baby: 'Baby changing', unisex: 'Unisex', open247: 'Open 24/7', hours_unknown: 'Opening hours unknown',
      nav: 'Walk here', unnamed: 'Public toilet', near_word: 'near', inside_word: 'at',
      rep_q: 'Been here? One tap helps everyone.', rep_ok: 'It works', rep_closed: 'Closed', rep_bad: 'Filthy',
      thanks: 'Thanks, saved on this device.',
      empty_filters: 'No toilet survives this many filters at once. Turn one off and try again.',
      empty_search: function(q){ return 'Nothing matches "' + q + '". Even Budapest’s toilets have their limits. Try a shorter word.'; },
      reset_btn: 'Reset filters',
      tagline: 'Every public toilet in Budapest, mapped so nature never has to wait.',
      loading: 'Scouting Budapest for facilities…',
      search_ph: 'Search toilets, cafés, parks…',
      search_label: 'Search toilets',
      search_clear: 'Clear search',
      sort_near: 'Closest', sort_free: 'Free first', sort_open: 'Open first',
      kind_vendeglatohely: 'restaurant/bar', kind_epulet: 'building', kind_park: 'park', kind_plaza: 'mall',
      kind_allomas: 'station', kind_intezmeny: 'institution', kind_benzinkut: 'gas station',
      foot: 'Toilet locations come from OpenStreetMap contributors, available under the ODbL licence. Where a field says unknown, it really is unknown: we do not guess. Opening hours are only recorded for a minority of locations, so always treat them as a hint, not a promise.'
    },
    hu: {
      near: 'Mutasd a közelieket', locating: 'Helymeghatározás…', denied: 'Helymeghatározás letiltva, mind látszik',
      count: function(n, t){ return n + ' / ' + t + ' mosdó'; },
      sortedNear: 'legközelebbi elöl', sortedAll: 'még nincs helyadat',
      f_open: 'Most nyitva', f_free: 'Ingyenes', f_step: 'Vásárlás nélkül', f_wc: 'Akadálymentes', f_baby: 'Pelenkázó',
      free: 'Ingyenes', paid: 'Fizetős', fee_unknown: 'Díj nem ismert', customers: 'Csak vásárlóknak',
      wc_yes: 'Akadálymentes', wc_no: 'Nem akadálymentes', wc_lim: 'Részben akadálymentes', wc_unknown: 'Akadálymentesség nem ismert',
      baby: 'Pelenkázó', unisex: 'Nem szerint nem elválasztott', open247: 'Non-stop', hours_unknown: 'Nyitvatartás nem ismert',
      nav: 'Útvonal', unnamed: 'Nyilvános mosdó', near_word: 'közelében', inside_word: 'itt:',
      rep_q: 'Jártál itt? Egy koppintás másoknak is segít.', rep_ok: 'Működik', rep_closed: 'Zárva', rep_bad: 'Szörnyű',
      thanks: 'Kösz, elmentve ezen az eszközön.',
      empty_filters: 'Ennyi szűrővel egyszerre egyetlen mosdó sem marad talpon. Kapcsolj ki egyet, és nézzük újra.',
      empty_search: function(q){ return 'Erre semmi nem illik: "' + q + '". Még Budapest mosdóinak is vannak határai. Próbálj rövidebb szót.'; },
      reset_btn: 'Szűrők törlése',
      tagline: 'Budapest összes nyilvános mosdója egy térképen, hogy a természet ne várakoztasson.',
      loading: 'Épp felderítjük Budapest mosdóit…',
      search_ph: 'Keress mosdót, kávézót, parkot…',
      search_label: 'Mosdók keresése',
      search_clear: 'Keresés törlése',
      sort_near: 'Legközelebbi', sort_free: 'Ingyenes elöl', sort_open: 'Non-stop elöl',
      kind_vendeglatohely: 'vendéglátóhely', kind_epulet: 'épület', kind_park: 'park', kind_plaza: 'pláza',
      kind_allomas: 'állomás', kind_intezmeny: 'intézmény', kind_benzinkut: 'benzinkút',
      foot: 'A mosdók helye az OpenStreetMap közösségétől származik, ODbL licenc alatt. Ahol azt írjuk, hogy nem ismert, az tényleg nem ismert: nem tippelünk. Nyitvatartás csak a helyek kisebb részénél van rögzítve, ezért azt mindig jelzésnek vegyétek, ne ígéretnek.'
    }
  };

  // maps OSM `kind` values to the two translation keys above
  var KIND_KEY = {
    'vendeglatohely': 'kind_vendeglatohely', 'épület': 'kind_epulet', 'park': 'kind_park',
    'pláza': 'kind_plaza', 'állomás': 'kind_allomas', 'intézmény': 'kind_intezmeny', 'benzinkút': 'kind_benzinkut'
  };

  var lang = (navigator.language || 'en').slice(0,2) === 'hu' ? 'hu' : 'en';
  var items = [], me = null, map, layer, markersById = {};
  var filters = { open:false, free:false, step:false, wc:false, baby:false };
  var searchQuery = ''; // normalized (lowercase, no diacritics)
  var sortMode = 'near'; // near | free | open
  var countAnim = { token: 0, current: null, didFirst:false };
  var reports = {};
  try { reports = JSON.parse(localStorage.getItem('ntp-reports') || '{}'); } catch(e){}

  function tr(){ return T[lang]; }

  function prefersReducedMotion(){
    try { return window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches; } catch(e){ return false; }
  }

  // accent/case-insensitive normalize: "kávézó" and "KAVEZO" both -> "kavezo"
  function normalize(s){
    return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  }

  function kindLabel(kind){
    var key = KIND_KEY[kind];
    return key ? tr()[key] : '';
  }

  // --- nyitvatartas ertelmezes: csak a ket gyakori forma, a tobbit nem talaljuk ki ---
  function isOpenNow(oh){
    if (!oh) return null;
    if (/^24\/7$/.test(oh.trim())) return true;
    var m = oh.match(/^Mo-Su\s+(\d{2}):(\d{2})-(\d{2}):(\d{2})$/);
    if (m){
      var now = new Date(), mins = now.getHours()*60 + now.getMinutes();
      var a = +m[1]*60 + +m[2], b = +m[3]*60 + +m[4];
      return b > a ? (mins >= a && mins < b) : (mins >= a || mins < b);
    }
    return null;
  }

  function dist(a, b){
    var R = 6371000, dLa = (b.lat-a.lat)*Math.PI/180, dLo = (b.lon-a.lon)*Math.PI/180;
    var la1 = a.lat*Math.PI/180, la2 = b.lat*Math.PI/180;
    var h = Math.sin(dLa/2)*Math.sin(dLa/2) + Math.cos(la1)*Math.cos(la2)*Math.sin(dLo/2)*Math.sin(dLo/2);
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function fmtDist(m){ return m < 1000 ? Math.round(m/10)*10 + ' m' : (m/1000).toFixed(1) + ' km'; }

  function title(it){
    var t = tr();
    if (!it.place) return t.unnamed;
    if (it.inside) return it.place;
    return lang === 'hu' ? (it.place + ' ' + t.near_word) : (t.near_word + ' ' + it.place);
  }
  function where(it){
    // a helyszin neve a cimben van, itt NEM ismeteljuk meg
    var bits = [];
    var kl = kindLabel(it.kind);
    if (kl) bits.push(kl);
    if (it.operator) bits.push(it.operator);
    if (it.dist != null) bits.push(fmtDist(it.dist));
    return bits.join(' · ');
  }

  function tags(it){
    var t = tr(), out = [];
    if (it.fee === 'free') out.push(['free', t.free]);
    else if (it.fee === 'paid') out.push(['paid', t.paid + (it.charge ? ' · ' + it.charge : '')]);
    else out.push(['nodata', t.fee_unknown]);
    if (it.customers_only) out.push(['warn', t.customers]);
    var o = isOpenNow(it.hours);
    if (it.hours === '24/7') out.push(['ok', t.open247]);
    else if (it.hours) out.push([o === true ? 'ok' : (o === false ? 'warn' : ''), it.hours]);
    else out.push(['nodata', t.hours_unknown]);
    if (it.wheelchair === 'yes' || it.wheelchair === 'designated') out.push(['ok', t.wc_yes]);
    else if (it.wheelchair === 'limited') out.push(['', t.wc_lim]);
    else if (it.wheelchair === 'no') out.push(['warn', t.wc_no]);
    else out.push(['nodata', t.wc_unknown]);
    if (it.changing_table === 'yes') out.push(['', t.baby]);
    if (it.unisex === 'yes') out.push(['', t.unisex]);
    return out;
  }

  function searchMatch(it){
    if (!searchQuery) return true;
    return it._search && it._search.indexOf(searchQuery) !== -1;
  }

  function pass(it){
    if (!searchMatch(it)) return false;
    if (filters.open && isOpenNow(it.hours) !== true) return false;
    if (filters.free && it.fee !== 'free') return false;
    if (filters.step && it.customers_only) return false;
    if (filters.wc && !(it.wheelchair === 'yes' || it.wheelchair === 'designated')) return false;
    if (filters.baby && it.changing_table !== 'yes') return false;
    return true;
  }

  // facet counts for the filter chips: "how many results if I also turn this one on"
  var FILTER_PRED = {
    open: function(it){ return isOpenNow(it.hours) === true; },
    free: function(it){ return it.fee === 'free'; },
    step: function(it){ return !it.customers_only; },
    wc: function(it){ return it.wheelchair === 'yes' || it.wheelchair === 'designated'; },
    baby: function(it){ return it.changing_table === 'yes'; }
  };
  function facetCounts(){
    var keys = Object.keys(FILTER_PRED);
    var base = items.filter(searchMatch);
    var counts = {};
    keys.forEach(function(key){
      counts[key] = base.filter(function(it){
        return keys.every(function(k){
          if (k === key) return FILTER_PRED[k](it);
          return !filters[k] || FILTER_PRED[k](it);
        });
      }).length;
    });
    return counts;
  }

  function sortComparator(a, b){
    if (sortMode === 'free'){
      var af = a.fee === 'free' ? 0 : (a.fee == null ? 1 : 2);
      var bf = b.fee === 'free' ? 0 : (b.fee == null ? 1 : 2);
      if (af !== bf) return af - bf;
    } else if (sortMode === 'open'){
      var ao = isOpenNow(a.hours), bo = isOpenNow(b.hours);
      var av = ao === true ? 0 : (ao === null ? 1 : 2);
      var bv = bo === true ? 0 : (bo === null ? 1 : 2);
      if (av !== bv) return av - bv;
    }
    if (me) return a.dist - b.dist;
    return 0;
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]; }); }

  // Token-guarded: if a new count animation starts before an older one finished
  // (e.g. rapid filter/search taps), the older loop's frames self-cancel instead
  // of racing the DOM node and possibly leaving a WRONG final number on screen.
  // The shown count is factual data, so it must always converge on the true value.
  function animateCount(from, to){
    var myToken = ++countAnim.token;
    if (from === to || prefersReducedMotion()){
      var el0 = document.getElementById('countNum');
      if (el0) el0.textContent = to;
      countAnim.current = to;
      return;
    }
    var start = null, dur = 420;
    function step(ts){
      if (myToken !== countAnim.token) return; // superseded, stop updating
      if (start === null) start = ts;
      var p = Math.min(1, (ts - start) / dur);
      var ease = 1 - Math.pow(1 - p, 3);
      var val = Math.round(from + (to - from) * ease);
      var el = document.getElementById('countNum');
      if (el) el.textContent = val;
      countAnim.current = (p < 1) ? val : to;
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
    // safety net: if rAF ever stalls (throttled/background tab, odd embedding),
    // force the correct final number once the tween should clearly be over.
    // The count is factual data, it must never end up stuck on a wrong value.
    setTimeout(function(){
      if (myToken !== countAnim.token) return;
      var el = document.getElementById('countNum');
      if (el) el.textContent = to;
      countAnim.current = to;
    }, dur + 80);
  }

  var lastMetaRenderAt = 0;
  function renderMeta(shownCount){
    var t = tr();
    var full = t.count(shownCount, items.length);
    var withSpan = full.replace(/\d+/, '<span id="countNum">$&</span>');
    document.getElementById('meta').innerHTML = '<strong>' + withSpan + '</strong> · ' + (me ? t.sortedNear : t.sortedAll);
    var now = Date.now();
    var burst = (now - lastMetaRenderAt) < 250; // rapid successive changes (fast typing, quick taps)
    lastMetaRenderAt = now;
    // A szamlalo TENYADAT. Ezert csak az ELSO betoltesnel animalunk (0 -> osszes),
    // ott jatekos es nem tud rossz erteket mutatni, mert felfele szamol egy ures allapotbol.
    // Minden kesobbi valtozasnal (szuro, kereses, rendezes) AZONNAL a helyes szam all a DOM-ban.
    // Indok: a tween elso frame-je a KORABBI erteket irja ki, es ha a rAF akadozik
    // (hatterbe kerult ful, throttling, beagyazas), a rossz szam maradhat kint.
    countAnim.token++;
    countAnim.current = shownCount;
    if (!countAnim.didFirst){
      countAnim.didFirst = true;
      animateCount(0, shownCount);
    }
  }

  function focusItem(id){
    var it = null;
    for (var i = 0; i < items.length; i++){ if (items[i].id === id){ it = items[i]; break; } }
    if (!it || !map) return;
    map.setView([it.lat, it.lon], 17, { animate: true });
    var m = markersById[id];
    if (m) m.openPopup();
    highlightCard(id);
  }

  function highlightCard(id){
    var list = document.getElementById('list');
    var card = null;
    for (var i = 0; i < list.children.length; i++){
      if (list.children[i].dataset && list.children[i].dataset.id === id){ card = list.children[i]; break; }
    }
    if (!card) return;
    card.scrollIntoView({ behavior: prefersReducedMotion() ? 'auto' : 'smooth', block: 'center' });
    card.classList.add('item-focus');
    setTimeout(function(){ card.classList.remove('item-focus'); }, 1500);
  }

  function render(){
    var t = tr(), shown = items.filter(pass);
    shown.sort(sortComparator);

    renderMeta(shown.length);

    var list = document.getElementById('list'), empty = document.getElementById('empty');
    list.innerHTML = '';
    empty.hidden = shown.length > 0;

    if (!empty.hidden){
      var rawQ = (document.getElementById('search') || {}).value || '';
      var msg = searchQuery ? t.empty_search(rawQ) : t.empty_filters;
      empty.innerHTML = '<div class="emptyIcon" aria-hidden="true">🧭</div><p>' + esc(msg) + '</p>' +
        '<button class="btn resetBtn" id="resetBtn">' + esc(t.reset_btn) + '</button>';
    }

    shown.slice(0, 60).forEach(function(it, idx){
      var el = document.createElement('div');
      el.className = 'item';
      el.dataset.id = it.id;
      el.style.setProperty('--reveal-delay', Math.min(idx, 10) * 18 + 'ms');
      var said = reports[it.id];
      el.innerHTML =
        '<h3>' + esc(title(it)) + '</h3>' +
        '<p class="where">' + esc(where(it)) + '</p>' +
        '<div class="tags">' + tags(it).map(function(p){ return '<span class="t ' + p[0] + '">' + esc(p[1]) + '</span>'; }).join('') + '</div>' +
        '<div class="row"><a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=' + it.lat + ',' + it.lon + '&travelmode=walking">' + esc(t.nav) + '</a></div>' +
        '<div class="report"><div class="lbl">' + esc(t.rep_q) + '</div><div class="row">' +
          '<button class="btn' + (said && said.v === 'ok' ? ' picked' : '') + '" data-rep="ok" data-id="' + it.id + '">' + esc(t.rep_ok) + '</button>' +
          '<button class="btn' + (said && said.v === 'closed' ? ' picked' : '') + '" data-rep="closed" data-id="' + it.id + '">' + esc(t.rep_closed) + '</button>' +
          '<button class="btn' + (said && said.v === 'bad' ? ' picked' : '') + '" data-rep="bad" data-id="' + it.id + '">' + esc(t.rep_bad) + '</button>' +
        '</div>' + (said ? '<div class="said">' + esc(t.thanks) + '</div>' : '') + '</div>';
      list.appendChild(el);
    });

    if (layer){
      layer.clearLayers();
      markersById = {};
      shown.forEach(function(it){
        var color = it.fee === 'free' ? '#15803d' : (it.fee === 'paid' ? '#b45309' : '#6b7a77');
        var marker = L.circleMarker([it.lat, it.lon], { radius:7, weight:2, color:'#fff', fillColor:color, fillOpacity:1 })
          .bindPopup('<strong>' + esc(title(it)) + '</strong><br>' + esc(where(it)))
          .addTo(layer);
        marker.on('click', function(id){ return function(){ highlightCard(id); }; }(it.id));
        markersById[it.id] = marker;
      });
    }
  }

  function buildFilters(){
    var t = tr(), wrap = document.getElementById('filters');
    var counts = facetCounts();
    var defs = [['open', t.f_open], ['free', t.f_free], ['step', t.f_step], ['wc', t.f_wc], ['baby', t.f_baby]];
    wrap.innerHTML = defs.map(function(d){
      var c = counts[d[0]];
      return '<button class="chip ' + (filters[d[0]] ? 'on' : '') + (c === 0 ? ' zero' : '') + '" data-f="' + d[0] + '">' +
        esc(d[1]) + ' <span class="cnt">' + c + '</span></button>';
    }).join('');
  }

  function buildSortbar(){
    var t = tr(), wrap = document.getElementById('sortbar');
    var defs = [['near', t.sort_near], ['free', t.sort_free], ['open', t.sort_open]];
    wrap.innerHTML = defs.map(function(d){
      return '<button class="sortbtn ' + (sortMode === d[0] ? 'on' : '') + '" data-sort="' + d[0] + '">' + esc(d[1]) + '</button>';
    }).join('');
  }

  function refresh(){ buildFilters(); buildSortbar(); render(); }

  function resetAll(){
    filters = { open:false, free:false, step:false, wc:false, baby:false };
    searchQuery = '';
    var input = document.getElementById('search');
    input.value = '';
    document.getElementById('searchClear').hidden = true;
    refresh();
  }

  function requestLocation(){
    var btn = document.getElementById('locBtn');
    if (!navigator.geolocation) return;
    btn.textContent = tr().locating;
    navigator.geolocation.getCurrentPosition(function(pos){
      me = { lat: pos.coords.latitude, lon: pos.coords.longitude };
      items.forEach(function(it){ it.dist = dist(me, it); });
      btn.textContent = tr().near;
      if (map){ map.setView([me.lat, me.lon], 15); L.circleMarker([me.lat, me.lon], { radius:8, weight:3, color:'#0d9488', fillColor:'#fff', fillOpacity:1 }).addTo(layer); }
      render();
    }, function(){
      btn.textContent = tr().denied;
      setTimeout(function(){ btn.textContent = tr().near; }, 2500);
    }, { enableHighAccuracy:true, timeout:8000 });
  }

  function setLang(l){
    lang = l;
    document.documentElement.lang = l;
    document.getElementById('langEn').className = l === 'en' ? 'on' : '';
    document.getElementById('langHu').className = l === 'hu' ? 'on' : '';
    document.getElementById('locBtn').textContent = tr().near;
    document.getElementById('tagline').textContent = tr().tagline;
    var search = document.getElementById('search');
    search.placeholder = tr().search_ph;
    search.setAttribute('aria-label', tr().search_label);
    document.getElementById('searchClear').setAttribute('aria-label', tr().search_clear);
    document.getElementById('footer').innerHTML = esc(tr().foot) +
      ' <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">© OpenStreetMap</a>';
    refresh();
  }

  document.addEventListener('click', function(e){
    var chip = e.target.closest('[data-f]');
    if (chip){ filters[chip.dataset.f] = !filters[chip.dataset.f]; refresh(); return; }

    var sortBtn = e.target.closest('[data-sort]');
    if (sortBtn){
      sortMode = sortBtn.dataset.sort;
      if (sortMode === 'near' && !me) requestLocation();
      refresh();
      return;
    }

    var rep = e.target.closest('[data-rep]');
    if (rep){
      reports[rep.dataset.id] = { v: rep.dataset.rep, at: Date.now() };
      try { localStorage.setItem('ntp-reports', JSON.stringify(reports)); } catch(err){}
      render();
      return;
    }

    var resetBtn = e.target.closest('#resetBtn');
    if (resetBtn){ resetAll(); return; }

    if (e.target.closest('a,button')) return;

    var card = e.target.closest('.item');
    if (card && card.dataset.id) focusItem(card.dataset.id);
  });
  document.getElementById('langEn').addEventListener('click', function(){ setLang('en'); });
  document.getElementById('langHu').addEventListener('click', function(){ setLang('hu'); });
  document.getElementById('locBtn').addEventListener('click', requestLocation);

  var searchTimer = null;
  document.getElementById('search').addEventListener('input', function(e){
    var val = e.target.value;
    document.getElementById('searchClear').hidden = !val;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(function(){
      searchQuery = normalize(val.trim());
      refresh();
    }, 150);
  });
  document.getElementById('searchClear').addEventListener('click', function(){
    var input = document.getElementById('search');
    input.value = '';
    this.hidden = true;
    searchQuery = '';
    refresh();
    input.focus();
  });

  document.getElementById('meta').textContent = tr().loading;
  document.getElementById('list').innerHTML = '<div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>';

  fetch(BASE + '/data/toilets.json').then(function(r){ return r.json(); }).then(function(d){
    items = d.items;
    items.forEach(function(it){
      it._search = normalize([it.place, it.kind, T.en[KIND_KEY[it.kind]], T.hu[KIND_KEY[it.kind]], it.operator].filter(Boolean).join(' '));
    });
    map = L.map('map', { zoomControl:true }).setView([47.4979, 19.0402], 13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19, attribution: '© OpenStreetMap'
    }).addTo(map);
    layer = L.layerGroup().addTo(map);
    document.getElementById('search').disabled = false;
    setLang(lang);
  });

  if ('serviceWorker' in navigator){
    navigator.serviceWorker.register(BASE + '/sw.js', { scope: BASE + '/' }).catch(function(){});
  }
})();
</script>
</body>
