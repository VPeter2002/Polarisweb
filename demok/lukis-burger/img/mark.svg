<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Luki&#8217;s Burger">
  <rect width="160" height="160" rx="34" fill="#16120F"/>
  <g transform="translate(80,84) scale(1.72)" color="#F0B429">
<g>
    <!-- horns: from the top corners of the skull, out and then sharply up -->
    <path fill="currentColor" d="M-19,-18 C-29,-22 -36,-26 -38,-32 C-39,-36 -42,-35 -41,-30 C-39,-21 -30,-14 -20,-12 Z"/>
    <path fill="currentColor" d="M19,-18 C29,-22 36,-26 38,-32 C39,-36 42,-35 41,-30 C39,-21 30,-14 20,-12 Z"/>
    <!-- ears -->
    <ellipse cx="-23" cy="-6" rx="7" ry="4.2" fill="currentColor" transform="rotate(-18 -23 -6)"/>
    <ellipse cx="23" cy="-6" rx="7" ry="4.2" fill="currentColor" transform="rotate(18 23 -6)"/>
    <!-- skull: broad brow tapering into the muzzle -->
    <path fill="currentColor" d="M-19,-19 C-6,-23 6,-23 19,-19 C21,-9 20,-1 16,6 C13,16 7,21 0,21 C-7,21 -13,16 -16,6 C-20,-1 -21,-9 -19,-19 Z"/>
    <!-- forelock tuft between the horns -->
    <path fill="currentColor" d="M-7,-20 C-5,-27 -2,-29 0,-26 C2,-29 5,-27 7,-20 Z"/>
    <!-- eyes -->
    <ellipse cx="-8.6" cy="-8" rx="3.1" ry="2.6" fill="#F6F1E7"/>
    <ellipse cx="8.6" cy="-8" rx="3.1" ry="2.6" fill="#F6F1E7"/>
    <!-- muzzle -->
    <path fill="#F6F1E7" d="M-11,6 C-11,1.5 11,1.5 11,6 L11,11 C11,16 7,18.5 0,18.5 C-7,18.5 -11,16 -11,11 Z"/>
    <path fill="currentColor" d="M-5.6,7.2 C-3.4,7.2 -3.4,11.4 -5.6,11.4 C-7.8,11.4 -7.8,7.2 -5.6,7.2 Z"/>
    <path fill="currentColor" d="M5.6,7.2 C7.8,7.2 7.8,11.4 5.6,11.4 C3.4,11.4 3.4,7.2 5.6,7.2 Z"/>
    <path d="M-4.5,15 C-1.5,16.6 1.5,16.6 4.5,15" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" fill="none"/>
  </g>
  </g>
</svg>
